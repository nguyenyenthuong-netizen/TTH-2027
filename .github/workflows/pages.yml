name: Xuat ban 5 giao dien TTH
on:
  push:
    branches: [main]
    paths:
      - 'tth-site.zip'
      - 'TTH_5_Giao_Dien_GitLab_Pages_Free.zip'
      - '.github/workflows/pages.yml'
      - 'scripts/layout_fix.py'
      - 'scripts/remove_extra_navigation.py'
      - 'scripts/final_pages_guard.py'
      - 'scripts/khung_text_zoom.py'
      - 'scripts/crm_sidebar_cleanup.py'
      - 'scripts/crm_roadmap_phases_2027.py'
      - 'scripts/crm_phase_roadmap_gate_2027.py'
      - 'scripts/site_consistency_audit.py'
      - 'scripts/khung_dinh_bien_chi_so_audit.py'
      - 'scripts/khung_cvt_deep_audit_2027.py'
      - 'scripts/khung_contradiction_resolution_2027.py'
      - 'scripts/khung_dinh_bien_36_lock_2027.py'
      - 'scripts/khung_cvt_final_authority_guard_2027.py'
      - 'scripts/khung_title_always_on_guard_2027.py'
      - 'scripts/khung_cvt_role_names_boundary_2027.py'
      - 'scripts/khung_cnnv_chuan_hoa_2027.py'
      - 'scripts/khung_tong_the_12_view_audit_2027.py'
      - 'scripts/khung_cvt_boundary_integrity_2027.py'
      - 'scripts/khung_operational_integrity_2027.py'
      - 'scripts/khung_integrity_runtime_guard_2027.py'
      - 'scripts/khung_output_contract_audit_2027.py'
      - 'scripts/khung_output_semantic_review_2027.py'
      - 'scripts/khung_export_output_matrix_2027.py'
      - 'scripts/khung_browser_acceptance_2027.py'
      - 'scripts/khung_scenario_acceptance_2027.py'
      - 'scripts/khung_cvt_examples_2027.py'
      - 'scripts/khung_final_conflict_gate_2027.py'
      - 'scripts/khung_cvt_semantic_crosscheck_2027.py'
      - 'scripts/khung_cvt_25_boundary_lock_2027.py'
      - 'scripts/slide_web_app_fix_2027.py'
      - 'scripts/slide_tree_after8_2027.py'
      - 'scripts/tth_five_asset_logic_fix_2027.py'
      - 'scripts/app_all_pages_scroll_2027.py'
      - 'scripts/app_button_routes_audit_2027.py'
      - 'scripts/healthcare_interaction_fix_2027.py'
      - 'scripts/app_known_routes_fix_2027.py'
      - 'scripts/website_wide_content_2027.py'
      - 'scripts/tth_five_asset_browser_qa_2027.py'
      - 'pages-overrides/trinh-chieu-marketing/**'
      - 'pages-overrides/catalog/**'
      - 'scripts/catalog_fit_qa_2027.py'
      - 'pages-overrides/2027-1911-final/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Keep active browser QA and deployment running when unrelated Khung commits arrive.
  # GitHub still coalesces pending runs to the latest main commit.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4
      - name: Giai nen dung cau truc ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [[ -f tth-site.zip ]]; then
            unzip -q tth-site.zip -d _site
          elif [[ -f TTH_5_Giao_Dien_GitLab_Pages_Free.zip ]]; then
            mkdir -p _input
            unzip -q TTH_5_Giao_Dien_GitLab_Pages_Free.zip -d _input
            cp -a _input/public/. _site/
          else
            echo "Thieu tep ZIP voi 5 giao dien" >&2
            exit 1
          fi
          test -s _site/index.html
          for route in khung-marketing trinh-chieu-marketing crm-da-kenh healthcare-app healthcare-website; do
            test -s "_site/$route/index.html" || { echo "Thieu giao dien $route" >&2; exit 1; }
          done
          touch _site/.nojekyll
      - name: Sua loi chong nut, che noi dung va o nhap App
        run: python3 scripts/layout_fix.py _site
      - name: Cap nhat ban trinh chieu 27 trang - van phong chinh thuc
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-overrides/trinh-chieu-marketing/index.html
          test -s pages-overrides/trinh-chieu-marketing/assets/tth-logo.png
          mkdir -p _site/trinh-chieu-marketing
          cp -a pages-overrides/trinh-chieu-marketing/. _site/trinh-chieu-marketing/
          test -s _site/trinh-chieu-marketing/index.html
          test -s _site/trinh-chieu-marketing/assets/tth-logo.png
          python3 - <<'PY'
          from pathlib import Path
          s=Path('_site/trinh-chieu-marketing/index.html').read_text(encoding='utf-8')
          assert s.count('<section class="slide') == 27
          assert 'Bốn nội dung trọng tâm của phương án' in s
          assert 'Không tranh luận quy tắc đặt tên' not in s
          PY
      - name: Bo thanh dieu huong phu tren ca 5 giao dien
        run: python3 scripts/remove_extra_navigation.py _site
      - name: Cap nhat khung va slide 19-11-2026 tren GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          override_dir=pages-overrides/2027-1911-final
          mkdir -p _site/khung-marketing _site/trinh-chieu-marketing
          cat "$override_dir"/khung.part* > _site/khung-marketing/index.html
          cat "$override_dir"/slide.part* > _site/trinh-chieu-marketing/index.html
          python3 - <<'PY'
          from pathlib import Path
          k=Path('_site/khung-marketing/index.html').read_text('utf-8')
          s=Path('_site/trinh-chieu-marketing/index.html').read_text('utf-8')
          assert '<html' in k and 'tth-standard-review' in k and 'KB-DV12' in k
          assert 'Chuyên viên trưởng Nội dung' in k and 'tth-org-layout-rebuild-2027' in k and 'mkt-org-local-row' in k and 'class="org-right-teams"' in k
          assert s.count('<section class="slide') == 27
          assert 'tth-floating-arrow' in s and 'tth-slide-once-19112026' in s
          print('PASS: Khu ng',len(k),'ki tu; slide 27 trang',len(s),'ki tu')
          PY
      - name: Loai loi ten CVT va phan dinh chu quan ly truoc kiem thu
        run: python3 scripts/khung_cvt_boundary_integrity_2027.py _site pre
      - name: Doi chieu CVT1 CVT2 tren tat ca bang chuc danh va quy trinh
        run: python3 scripts/khung_cvt_deep_audit_2027.py _site
      - name: Doi chieu mau thuan 26 chuc danh, 60 quy trinh va dinh bien
        run: python3 scripts/khung_contradiction_resolution_2027.py _site
      - name: Kiem tra va bao ve hien thi ban ghi de cuoi cung
        run: python3 scripts/final_pages_guard.py _site
      - name: Bo nut tang giam co chu va chong cat bang cua khung
        run: python3 scripts/khung_text_zoom.py _site
      - name: CRM chuyen nut ve sidebar, bo thanh ngang phu
        run: python3 scripts/crm_sidebar_cleanup.py _site
      - name: Ra soat thong nhat khung slide CRM va hien thi
        run: python3 scripts/site_consistency_audit.py _site
      - name: Sua noi dung slide bi cat va kiem tra cau truc website app
        run: python3 scripts/slide_web_app_fix_2027.py _site
      - name: Khac phuc slide 8 bi cat noi dung phan quyen hai Chuyen vien truong
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/trinh-chieu-marketing/index.html')
          s=p.read_text('utf-8')
          before='.slide[data-index="7"] .content:has(.tth-chief-strip){display:flex!important;flex-direction:column!important;gap:12px!important;overflow:hidden!important}'
          after='.slide[data-index="7"] .content:has(.tth-chief-strip){display:flex!important;flex-direction:column!important;gap:12px!important;overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain!important}'
          if s.count(before)!=1:
              raise SystemExit('FAIL: khong tim thay duy nhat quy tac cat noi dung slide 8')
          s=s.replace(before,after,1)
          assert s.count('<section class="slide')==27
          assert s.count(after)==1
          assert 'tth-chief-strip' in s
          p.write_text(s,'utf-8')
          print('PASS: slide 8 co the cuon khi noi dung dai; 27 slide giu nguyen')
          PY
      - name: Khoa dinh bien chuan 36 suat - 22 TCT va 14 co so
        run: python3 scripts/khung_dinh_bien_36_lock_2027.py _site
      - name: Khoa quyen hai Chuyen vien truong va chong luong quy trinh
        run: python3 scripts/khung_cvt_final_authority_guard_2027.py _site
      - name: Doi soat dinh bien, dau ra, KPI va quy trinh cua 26 vi tri
        run: python3 scripts/khung_dinh_bien_chi_so_audit.py _site
      - name: Dong bo mau nen do mo cac dong tieu de always on cho 12 muc
        run: python3 scripts/khung_title_always_on_guard_2027.py _site
      - name: Dung dung ten chuc danh Chuyen vien truong va doi chieu khong chong cheo
        run: python3 scripts/khung_cvt_role_names_boundary_2027.py _site
      - name: Chuan hoa CNNV, MTCV, quan ly quy chuan, phan quyen va tai viec
        run: python3 scripts/khung_cnnv_chuan_hoa_2027.py _site
      - name: Kiem thu ket thuc khong CVT chung, khong hai cap quan ly
        run: python3 scripts/khung_cvt_boundary_integrity_2027.py _site post
      - name: Xu ly ma vai tro chung, tu kiem, tai To truong va kiem tra tat ca buoc
        run: python3 scripts/khung_operational_integrity_2027.py _site
      - name: Kiem thu 407 buoc 95 phan tuyen 14 tu kiem va cu phap JavaScript
        run: python3 scripts/khung_integrity_runtime_guard_2027.py _site
      - name: Doi soat 568 dau ra voi mot chu tri mot tuyen mot quyen duyet va mot so gio
        run: python3 scripts/khung_output_contract_audit_2027.py _site
      - name: Doi chieu ngu nghia 568 dau ra, chung tu va tung nguoi chiu trach nhiem
        run: python3 scripts/khung_output_semantic_review_2027.py _site
      - name: Xuat ma tran 568 dau ra kem cot giao viec va chung tu kiem chung
        run: python3 scripts/khung_export_output_matrix_2027.py _site
      - name: Kiem tra lai JavaScript sau khi them bang dau ra
        run: python3 scripts/khung_integrity_runtime_guard_2027.py _site
      - name: Kiem thu 18 tinh huong nghiep vu ve duyet phat hanh va tai viec
        run: python3 scripts/khung_scenario_acceptance_2027.py _site
      - name: Kiem tra cu phap Python truoc khi cap nhat nhom luong cuoi
        run: python3 -m py_compile scripts/khung_cvt_examples_2027.py scripts/khung_final_conflict_gate_2027.py scripts/khung_browser_acceptance_2027.py
      - name: Bo sung 14 vi du van hanh hai Chuyen vien truong theo tung quy trinh
        run: python3 scripts/khung_cvt_examples_2027.py _site
      - name: Kiem tra JavaScript sau khi bo sung vi du
        run: python3 scripts/khung_integrity_runtime_guard_2027.py _site
      - name: Khoa nguyen tac 1 chu tri 1 tuyen 1 duyet 1 gio va dong bo 568 dau ra
        run: python3 scripts/khung_final_conflict_gate_2027.py _site
      - name: Kiem tra lai JavaScript sau khi khoa xung dot
        run: python3 scripts/khung_integrity_runtime_guard_2027.py _site
      - name: Kiem tra cu phap khoa 25 buoc va 568 dau ra chuyen biet
        run: python3 -m py_compile scripts/khung_cvt_25_boundary_lock_2027.py
      - name: Phan dinh 25 buoc hai CVT va danh muc 568 dau ra can chot chung tu
        run: python3 scripts/khung_cvt_25_boundary_lock_2027.py _site
      - name: Kiem toan cheo chuc nang luong van hanh va 568 dau ra hai Chuyen vien truong
        run: python3 scripts/khung_cvt_semantic_crosscheck_2027.py _site
      - name: Kiem toan toan bo 12 phan va 5 ten To Marketing truoc kiem thu trinh duyet
        run: python3 scripts/khung_tong_the_12_view_audit_2027.py _site
      - name: Cai thu vien kiem tra giao dien bang Chrome
        run: python3 -m pip install --user --break-system-packages --disable-pip-version-check playwright==1.55.0 Pillow
      - name: Thu 8 luong thuc te tren desktop va mobile
        run: python3 scripts/khung_browser_acceptance_2027.py _site
      - name: Luu anh va bien ban kiem tra giao dien
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khung-marketing-e2e-${{ github.run_number }}
          path: artifacts/khung-e2e/
          if-no-files-found: ignore
      - name: Bo sung so do cay co cau Marketing sau trang 8 va doi thanh 28 slide
        run: python3 scripts/slide_tree_after8_2027.py _site
      - name: Kiem soat logic lien thong Khung Slide Website App CRM
        run: python3 scripts/tth_five_asset_logic_fix_2027.py _site
      - name: CRM lo trinh giai doan 1 CRM Call Center HIS va giai doan 2 chi da kenh
        run: python3 scripts/crm_roadmap_phases_2027.py _site
      - name: Khoa dung 3 giai doan CRM Call Center HIS da kenh do luong AI
        run: python3 scripts/crm_phase_roadmap_gate_2027.py _site
      - name: Mo rong cuon du trang va the ngang cho 102 man hinh App
        run: python3 scripts/app_all_pages_scroll_2027.py _site
      - name: Mo rong bo cuc Website va can le tranh CTA
        run: python3 scripts/website_wide_content_2027.py _site
      - name: Sua nut hoi tro ly va o tim kiem khong tu chuyen trang
        run: python3 scripts/healthcare_interaction_fix_2027.py _site
      - name: Noi cac nut App den dung man hinh nghiep vu da co
        run: python3 scripts/app_known_routes_fix_2027.py _site
      - name: Kiem tra toan bo nut va luong hoi tro ly App Website
        run: python3 scripts/app_button_routes_audit_2027.py _site
      - name: Kiem tra trinh duyet 5 tai san desktop va mobile
        run: python3 scripts/tth_five_asset_browser_qa_2027.py _site
      - name: Thay trang danh muc cu bang danh muc TTH Group fit 1 man hinh
        run: |
          set -euo pipefail
          cp pages-overrides/catalog/index.html _site/index.html
          test -s _site/trinh-chieu-marketing/assets/tth-logo.png
      - name: Kiem tra logo goc, 7 lien ket Vercel va fit desktop/mobile
        run: python3 scripts/catalog_fit_qa_2027.py _site
      - name: Luu anh nghiem thu trang danh muc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-tth-group-${{ github.run_number }}
          path: artifacts/tth-catalog/
          if-no-files-found: ignore
      - name: Cau hinh GitHub Pages
        uses: actions/configure-pages@v5
      - name: Tai site len GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Trien khai cong khai
        id: deployment
        uses: actions/deploy-pages@v4
