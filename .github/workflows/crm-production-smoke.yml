name: Smoke test CRM Vercel 2 phases and slide 04 readability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-production-smoke.yml'
permissions:
  contents: read
jobs:
  crm-vercel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Read CRM Vercel production, 2 phases, and slide 04 typography
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 90 \
            'https://tth-crm-da-kenh.vercel.app/?verify=technology-department-2027-271' -o /tmp/tth-crm-production.html
          python3 - <<'PY'
          import re, pathlib, html
          s=pathlib.Path('/tmp/tth-crm-production.html').read_text('utf-8')
          m=re.search(r'<div class="roadmap">(.*?)</div>\s*<div class="decisionGrid">',s,re.I|re.S)
          assert m,'Live Vercel CRM roadmap not found'
          titles=[html.unescape(re.sub(r'<br\s*/?>',' + ',x)) for x in re.findall(r'<div class="phase">.*?<b>(.*?)</b>',m.group(1),re.I|re.S)]
          titles=[' '.join(x.replace(' + + ',' + ').split()) for x in titles]
          print('CRM_VERCEL_LIVE_PHASES',titles)
          assert titles==['CRM + Call Center + HIS','AI'],f'Incorrect Vercel CRM roadmap: {titles}'
          assert 'id="tth-crm-s4-readability-2027"' in s,'Missing slide 04 typography override on Vercel'
          rule=re.search(r'#s4 \.role-rule>strong\s*\{([^}]+)\}',s,re.S)
          flow=re.search(r'#s4 \.tier-example-flow>span\s*\{([^}]+)\}',s,re.S)
          assert rule and 'font-size:17px' in rule.group(1),'Missing enlarged rule font'
          assert flow and 'font-size:16px' in flow.group(1),'Missing enlarged 1900 flow font'
          assert 'id="s7"' in s,'Seventh internal decision slide missing'
          assert 'id="tth-crm-his-example-style-2027"' in s,'CRM HIS example styling absent on production'
          assert 'CRM-00125' in s and 'BN-00876' in s and 'BN-00444' in s,'Illustrative HIS patient linkage absent'
          assert 'id="tth-crm-search-readability-2027"' in s,'Advanced search readability update absent'
          print('CRM_VERCEL_HIS_EXAMPLE_OK','CRM-00125','BN-00876','BN-00444','unverified remains separate')
          print('CRM_VERCEL_SEARCH_UI_OK','wider 700px desktop','responsive mobile')
          assert 'Phòng Công nghệ' in s,'Approved Technology Department name absent on Vercel'
          assert not re.search(r'(?<![\\w])CNTT(?![\\w])',s),'Outdated CNTT label remains on Vercel'
          assert 'Phòng Phòng Công nghệ' not in s,'Duplicated Phòng prefix in Technology Department label'
          print('CRM_VERCEL_DEPARTMENT_OK','Phòng Công nghệ','no CNTT','no duplicate prefix')


          print('CRM_VERCEL_FONT_OK','rule=17px','1900-cards=16px','slides=7')
          print('CRM_VERCEL_LIVE_OK',len(s),'bytes')
          PY
