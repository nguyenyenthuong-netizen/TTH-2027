name: Inspect CRM presentation structure for internal decision slide
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-slide-structure-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original CRM document and navigation (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,re,html
          from pathlib import Path
          with zipfile.ZipFile('TTH_5_Giao_Dien_GitLab_Pages_Free.zip') as z:
           text=z.read('public/crm-da-kenh/index.html').decode('utf-8')
          print('CRM_BYTES',len(text))
          for term in ['class="slide"','id="s1"','id="s2"','id="s3"','id="s4"','id="s5"','id="s6"','id="s7"','id="sideNav"','class="navbtn"','function show','function go','function setSlide','class="roadmap"','class="slideHeader"']:
           m=re.search(re.escape(term),text,re.I)
           print('CRM_TOKEN',term,'hits',len(re.findall(re.escape(term),text,re.I)), 'context',repr(text[max(0,m.start()-250):m.start()+1050]) if m else 'NOT_FOUND')
          print('CRM_SECTIONS')
          for m in re.finditer(r'<(?:section|div)\b[^>]*(?:id="s\d+"|class="[^"]*slide[^"]*")[^>]*>',text,re.I):
           print('CRM_SLIDE_ELEMENT',repr(text[m.start():m.start()+850]))
          print('CRM_NAV_SNIPPET')
          for term in ['id="sideNav"','class="navbtn"','const slides','let slides','document.querySelectorAll(".slide")','document.querySelectorAll(\'.slide\')','function activate','showSlide(']:
           m=re.search(re.escape(term),text,re.I)
           if m:print('CRM_NAV',term,repr(text[max(0,m.start()-300):m.start()+2200]))
          for phrase in ['QUY TẮC KHÔNG NGOẠI LỆ','Quy tắc không ngoại lệ','VÍ DỤ VẬN HÀNH','1900 → LỊCH KHÁM','Chủ ticket phản hồi']:
           m=re.search(re.escape(phrase),text,re.I)
           if m:print('CRM_FONT_TARGET',phrase,repr(text[max(0,m.start()-1600):m.start()+4700]))
           else:print('CRM_FONT_TARGET_MISSING',phrase)
          for styleterm in ['.rule', '.example', '.handoff','.tier-flow','.flow-example']:
           matches=[m.start() for m in re.finditer(re.escape(styleterm),text,re.I)][:12]
           print('CRM_FONT_STYLE',styleterm,[(p,text[max(0,p-90):p+220]) for p in matches])
          import json
          flows_match=re.search(r'const flows\s*=\s*(\[.*?\]);',text,re.S)
          if flows_match:
           flows=json.loads(flows_match.group(1))
           for i,flow in enumerate(flows):
            print('CRM_FLOW_NAME',i,repr(flow.get('name')),len(flow.get('nodes',[])))
            if str(flow.get('name','')).startswith('02'):
             print('CRM_FLOW02',json.dumps(flow,ensure_ascii=False)[:16000])
          for mark in ['function renderFlow','const renderFlow','function selectFlow','flowTabs','ux-search-launch','ux-search-panel','search-modal','search-result']:
           m=re.search(re.escape(mark),text,re.I)
           print('CRM_UI_PROBE',mark,repr(text[max(0,m.start()-850):m.start()+3000]) if m else 'NOT_FOUND')
          apptxt=z.read('public/healthcare-app/index.html').decode('utf-8') if False else ''
          with zipfile.ZipFile('TTH_5_Giao_Dien_GitLab_Pages_Free.zip') as appzip:
           apptxt=appzip.read('public/healthcare-app/index.html').decode('utf-8')
          import json
          catalog=re.search(r'<script\\s+id="pageData"[^>]*>(.*?)</script>',apptxt,re.S)
          if catalog:
           pages=json.loads(catalog.group(1))
           doc=pages.get('BatDau_DongY.html','')
           anchors=re.findall(r'<a\\b[^>]*href=["\\x27]#["\\x27][^>]*>.*?</a>',doc,re.S|re.I)
           print('APP_UNRESOLVED_TEST_PAGE',len(doc),'links',len(anchors))
           for i,a in enumerate(anchors[:15]):print('APP_ANCHOR',i,repr(a[:900]))
          print('CRM_END_MAIN',repr(text[text.rfind('</main>')-1000:text.rfind('</main>')+160]))
          print('CRM_END_BODY',repr(text[-5200:]))
          PY
